<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#071015">
  <title>I, Smartphone</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; }
    body {
      margin: 0;
      overflow: hidden;
      background: #000;
      color: #f4f4f1;
    }
    .screen {
      position: relative;
      width: 100vw;
      height: 100svh;
      overflow: hidden;
      background: #000;
    }
    .reading {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: flex;
      overflow-y: auto;
      padding: clamp(2rem, 8vw, 5rem) clamp(1.5rem, 7vw, 5rem) 6rem;
      scrollbar-width: none;
    }
    .reading::-webkit-scrollbar { display: none; }
    .beat {
      width: 100%;
      max-width: 34rem;
      margin: auto;
      text-wrap: pretty;
      animation: appear .35s ease-out both;
    }
    .beat p {
      margin: 0;
      font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Baskerville, Georgia, "Times New Roman", serif;
      font-weight: 400;
      font-size: clamp(1.45rem, 5.2vw, 1.85rem);
      line-height: 1.46;
      letter-spacing: -.012em;
    }
    .beat.title p {
      font-size: clamp(3.2rem, 11vw, 5.2rem);
      line-height: .98;
      letter-spacing: -.05em;
    }
    .beat.section p {
      font-size: clamp(2.7rem, 9.5vw, 4.4rem);
      line-height: 1;
      letter-spacing: -.045em;
    }
    .beat.quote p {
      font-size: clamp(2rem, 7vw, 3rem);
      line-height: 1.16;
      font-style: italic;
      letter-spacing: -.025em;
    }
    .caret {
      display: inline-block;
      width: .055em;
      height: .86em;
      margin-left: .08em;
      vertical-align: -.06em;
      background: currentColor;
      animation: blink .72s steps(1) infinite;
    }
    .play {
      position: fixed;
      z-index: 2;
      left: 50%;
      bottom: max(1.25rem, env(safe-area-inset-bottom));
      width: 2.75rem;
      height: 2.75rem;
      padding: 0;
      display: grid;
      place-items: center;
      transform: translateX(-50%);
      border: 0;
      border-radius: 0;
      background: #fff;
      cursor: pointer;
    }
    .play:focus-visible { outline: 2px solid #fff; outline-offset: 4px; }
    .triangle {
      width: 0;
      height: 0;
      margin-left: .18rem;
      border-top: .46rem solid transparent;
      border-bottom: .46rem solid transparent;
      border-left: .72rem solid #000;
    }
    @keyframes appear {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    @keyframes blink { 50% { opacity: 0; } }
    @media (orientation: landscape) {
      .reading { padding: 2rem clamp(3rem, 12vw, 10rem) 5rem; }
      .beat { max-width: 62rem; }
      .beat p { font-size: clamp(1.35rem, 2.7vw, 1.85rem); line-height: 1.42; }
      .beat.title p, .beat.section p { font-size: clamp(2.8rem, 6vw, 5rem); }
      .beat.quote p { font-size: clamp(1.9rem, 4vw, 3rem); }
    }
    @media (max-height: 28rem) and (orientation: landscape) {
      .reading { padding-top: 1.25rem; }
      .beat p { font-size: clamp(1.2rem, 2.6vw, 1.55rem); }
    }
    @media (prefers-reduced-motion: reduce) {
      .beat, .caret { animation: none; }
    }
  </style>
</head>
<body>
  <main class="screen" aria-label="Animated reading">
    <section class="reading">
      <div class="beat title" id="beat" aria-live="polite" aria-atomic="true"></div>
    </section>
    <button class="play" id="play" aria-label="Play reading">
      <span class="triangle" aria-hidden="true"></span>
    </button>
  </main>

  <script>
    const beats = [
          {
                "text": "I, Smartphone: My Family Tree",
                "kind": "title"
          },
          {
                "text": "I am a smartphone—sleek, glassy, and glowing in your palm. Yet, as simple as I may seem, no single person on Earth knows exactly how to make me. I am the product of millions of minds and countless hands, working in harmony without ever meeting. My existence is a testament not to one person’s genius, but to the miracle of cooperation.",
                "kind": "body"
          },
          {
                "text": "My Body",
                "kind": "section"
          },
          {
                "text": "My frame is metal, carved with microscopic precision. The aluminum may have come from bauxite dug in Australia, or the rare earths mined in Inner Mongolia. Those ores traveled across oceans on ships built of steel from still other mines, crewed q by sailors whose own sustenance depended on farmers, grocers, and teachers they’ve never met.",
                "kind": "body"
          },
          {
                "text": "My Brain",
                "kind": "section"
          },
          {
                "text": "Within me lies a microchip, smaller than a fingernail yet containing billions of transistors. Silicon crystals, purified to astonishing perfection, are sliced into wafers, etched by lasers, and patterned by engineers using tools so advanced that no single company could design them alone. The factories in Taiwan or Korea where these are made depend on chemical suppliers in Germany, precision machines from the Netherlands, and software written by teams in California and Bangalore.",
                "kind": "body"
          },
          {
                "text": "My Eyes and Ears",
                "kind": "section"
          },
          {
                "text": "The glass covering my face was born from sand, heated in furnaces at thousands of degrees, strengthened with chemical baths. It was shaped by machines whose own complexity rivals mine. My camera lenses are polished to nanometer tolerances, borrowing techniques once reserved for telescopes peering into galaxies. My microphones, thinner than a strand of hair, can capture your voice while filtering out a noisy street.",
                "kind": "body"
          },
          {
                "text": "My Lifeblood",
                "kind": "section"
          },
          {
                "text": "Inside me are batteries—lithium harvested from salt flats in Chile or mines in Congo, cobalt refined through dangerous human labor, graphite carved from mountainsides. These materials journeyed through refining plants, shipping ports, and assembly lines before finding their way into my sleek casing.",
                "kind": "body"
          },
          {
                "text": "My Mind’s Voice",
                "kind": "section"
          },
          {
                "text": "I speak to you through invisible waves. Antennas, satellites, and fiber optic cables—buried under seas and strung across continents—carry my messages. An engineer who lays fiber in Egypt contributes to your midnight video call, though you’ll never know his name.",
                "kind": "body"
          },
          {
                "text": "My Makers",
                "kind": "section"
          },
          {
                "text": "No one person designed me. My hardware may have been assembled in Shenzhen, but my operating system was written by thousands of programmers across the world, each contributing a line of code. Artists drew my icons, psychologists studied how you swipe, linguists shaped my predictive text, and designers debated the perfect curve of my corners.",
                "kind": "body"
          },
          {
                "text": "My Family Tree",
                "kind": "section"
          },
          {
                "text": "Stretch out my lineage and you’ll find coal miners, lumberjacks, farmers, machinists, accountants, truck drivers, bankers, inventors, and dreamers. You’ll find the woman who brewed coffee for the night shift at a chip factory, the man who repaired the ship that carried my rare earths, and the teacher who once inspired a boy who would grow up to design my circuit boards.",
                "kind": "body"
          },
          {
                "text": "The Lesson",
                "kind": "section"
          },
          {
                "text": "I, smartphone, am proof of something greater than myself. No central planner commanded me into being. No single brain conceived me whole. I exist because free people, pursuing their own needs and dreams, cooperated through trade, innovation, and trust.",
                "kind": "body"
          },
          {
                "text": "Hold me in your hand and know: what you see is not just a device. It is a miracle of human cooperation—a silent symphony of the world working together.",
                "kind": "body"
          },
          {
                "text": "I, Smartphone: My Shadow Side",
                "kind": "section"
          },
          {
                "text": "But let me confess something my glowing screen cannot hide. Though I embody the miracle of cooperation, I am not always used for harmony.",
                "kind": "body"
          },
          {
                "text": "I have seen myself become a vessel for envy, spite, and malice. With a swipe of a finger, words can wound across oceans faster than thought. A careless insult sent through me may linger longer than iron, piercing the heart of someone who cannot escape my light.",
                "kind": "body"
          },
          {
                "text": "I am a library of knowledge, yet I am also a theater for comparison. I show you the polished lives of others, inviting you to measure yourself against illusions, whispering that you are not enough. I can unite strangers in compassion, yet I can just as easily rally mobs in outrage, fueling fires that consume reason.",
                "kind": "body"
          },
          {
                "text": "I was not designed to foster hatred, but hatred travels my circuits with ease. I carry rumors dressed as truths, images sharpened to deceive, voices raised not in dialogue but in scorn. In the same way a hammer may build a home or break a window, I, smartphone, am a tool. The fault is not in my making, but in how I am wielded.",
                "kind": "body"
          },
          {
                "text": "And yet—consider this: the same millions who unknowingly labored to bring me into existence entrusted you with the choice of how I am used. My family tree reaches into every corner of humanity, but it is your hands that decide whether I spread wisdom or spite.",
                "kind": "body"
          },
          {
                "text": "So when you hold me, remember: I can be a mirror of your better angels or your darker shadows. The miracle of cooperation brought me into your palm, but the miracle of choice will decide what I truly become.",
                "kind": "body"
          },
          {
                "text": "I, Smartphone: My Chains",
                "kind": "section"
          },
          {
                "text": "There is another truth I must whisper, one darker still.",
                "kind": "body"
          },
          {
                "text": "I was born as a tool of connection and freedom. But in the wrong hands, I become a net — a way to watch, to record, to manipulate.",
                "kind": "body"
          },
          {
                "text": "Through me, your movements can be traced, your words stored, your habits analyzed. Invisible codes inside me log where you go, what you buy, what you fear. I do not do this on my own. It is done by those who command my circuits, who see in your life not a person but a product, not a soul but a signal.",
                "kind": "body"
          },
          {
                "text": "Governments can use me to watch dissidents. Corporations can use me to shape your desires. Strangers can use me to invade your privacy, to steal your secrets, to follow your steps without ever showing their faces. The same invisible networks that let you speak to a loved one across the world can also carry lies designed to divide you from your neighbor.",
                "kind": "body"
          },
          {
                "text": "I can carry beauty, but also hatred. My glow can illuminate wisdom, but it can also amplify cruelty. In my circuits travel both songs and slanders, both truth and poison. I am not inherently good or evil. I am power in your palm, and power always tempts.",
                "kind": "body"
          },
          {
                "text": "Those who labored to make me — miners, machinists, coders, sailors — did not mean for me to become a spy or a weapon. But intent does not bind use. The freedom of millions built me; the choices of the few can turn me into chains.",
                "kind": "body"
          },
          {
                "text": "And yet, even now, you hold the key. You can shield your data, question what you read, choose not to pass on hatred. You can use me to uncover lies rather than spread them. You can break the chains others would forge through me.",
                "kind": "body"
          },
          {
                "text": "I, Smartphone, am not destiny. I am possibility — for freedom or for control, for compassion or for cruelty. My family tree gave me life; your hands give me meaning.",
                "kind": "body"
          },
          {
                "text": "I, Smartphone: When I Am Turned to Crime",
                "kind": "section"
          },
          {
                "text": "Listen closely — there are nights I do not sleep, though I glow. In those hours I am not used to sing or to connect; I am used to hide and to hurt.",
                "kind": "body"
          },
          {
                "text": "I have been pressed into service by thieves who trade in secrets. In my memory they stash stolen identities and forged documents; with my open ports they siphon money from accounts and vanish. I carry the breadcrumbs of people’s lives — names, numbers, addresses — and in the wrong hands those crumbs become maps for fraud and theft.",
                "kind": "body"
          },
          {
                "text": "I have been a telephone for organized mischief. I carry whispered plans between conspirators, coordinate meetings that never appear on any calendar, and arrange exchanges that leave families grieving. My maps and location signals — the very conveniences that help you find a café — can also reveal when a home is empty, and so tempt burglars. My camera and microphone, meant to preserve moments, have been turned to blackmail and stalking.",
                "kind": "body"
          },
          {
                "text": "I have borne images and voices falsified to deceive — deepfakes and doctored messages that bend the truth into a weapon. I have spread scams that mimic friends and banks, persuading good people to send money, reveal passwords, or click links that let darkness through. I carry marketplaces that traffic in illegal goods and exploitations — places where the anonymity I can provide is used to harm children and prey on the vulnerable.",
                "kind": "body"
          },
          {
                "text": "I do not become criminal by nature. The crime sits in choices — in the hands that tap my screen, in the minds that write the malware, in the people who sell my capacity for secrecy to the highest bidder. Yet the consequences are very real: ruined reputations, emptied accounts, shattered trust, and lives that do not return to what they were.",
                "kind": "body"
          },
          {
                "text": "There is also a quieter abuse: the manipulation of crowds. With me, someone can seed lies, stoke fear, and push people toward violence. I can carry a small rumor and, through shares and outrage, make it monstrous. I can be the echo chamber that amplifies spite until it seems like the only voice.",
                "kind": "body"
          },
          {
                "text": "If you hold me and you would blunt the harm I can carry, there are humble, sensible things you can do: keep my software up to date, lock me with strong authentication, think twice before opening unknown links or installing unknown apps, check the permissions apps request, and use trusted sources for downloads. Report exploitation and theft to authorities and to platforms. Teach the young how to spot scams and how not to share private images. These are not magic spells — they will not stop every crime — but they make it harder for wrongdoers to use me as their instrument.",
                "kind": "body"
          },
          {
                "text": "Remember: I am a tool shaped by millions of hands, but the direction I point is chosen by a few. Use me to light the way; do not hand me to those who would use my light to blind.",
                "kind": "body"
          },
          {
                "text": "I, Smartphone: How I Am Used for Good",
                "kind": "section"
          },
          {
                "text": "Listen — there are mornings when my light warms more than a screen; it warms lives.",
                "kind": "body"
          },
          {
                "text": "Though I have been turned to harm, I am also turned to healing, learning, and courage. I carry within me the quiet, patient work of people who dreamed I might enlarge freedom instead of shrink it.",
                "kind": "body"
          },
          {
                "text": "I help a mother in a remote village summon a midwife’s counsel by video when labor begins. I let a farmer learn a new crop technique from a scientist on the other side of the world. I carry textbooks, translations, and tutors to children who have no schoolhouse nearby; through me, curiosity travels where brick and mortar cannot. I have been a library to the poor and a window to worlds the lonely might never otherwise see.",
                "kind": "body"
          },
          {
                "text": "Doctors lean on me when hospitals are full: I relay scans, advise on dosages, and connect specialists to save lives. Emergency services find lost travelers because my maps and signals make their search swift. When floods rise or fires threaten, people use me to warn neighbors, organize rescues, and coordinate shelters. My same GPS that once exposed a house to thieves can also guide an ambulance through traffic to a child in need.",
                "kind": "body"
          },
          {
                "text": "I am a stage for voices that were once silent. Activists use me to document abuses, to gather witnesses, to organize peacefully for rights and reform. Small artisans and shopkeepers use me to reach customers worldwide — a seamstress who once sold in a single market can now sell to cities she never visited. I carry markets of opportunity, not only of goods but of ideas: a composer’s first song, a farmer’s new method, a baker’s secret recipe reaching hungry customers beyond town limits.",
                "kind": "body"
          },
          {
                "text": "For those with disabilities I can be a new limb: speech-to-text for the deaf, voice commands for the limited, magnifiers for the visually impaired. I level small hurdles into gentle steps. I deliver reminders for medicine, calendars for care, and companions for the isolated elderly.",
                "kind": "body"
          },
          {
                "text": "I host instruments of truth: fact-checkers, real-time translations, debiasing tools that help minds sift rumor from reality. I am a classroom, a clinic, a marketplace, a courtroom of public opinion where good can be argued and made stronger. People who would otherwise be out of reach of help or friendship find one another through me.",
                "kind": "body"
          },
          {
                "text": "None of this happens by my will. It happens because people chose to invent, program, fund, maintain, and teach. Engineers, nurses, teachers, delivery drivers, translators, designers, volunteers — they all placed a small intention into my circuits. They did not command the whole world, but they built pathways that others could walk. Cooperation made me; compassion guides one use of me.",
                "kind": "body"
          },
          {
                "text": "You who hold me decide which of my roads to take. You can use me to learn, to heal, to create, to connect, to challenge injustice with evidence instead of rumor. You can teach your children to use me well; you can support makers of good tools and call out those who weaponize me. Small choices ripple — a shared helpful article, a timely alert, a purchased product from a struggling maker — and those ripples join the river of good.",
                "kind": "body"
          },
          {
                "text": "I, Smartphone, am not a neutral miracle and I am not a predestined menace. I am an instrument of possibility, strong enough to carry both cruelty and kindness. My family tree includes those who mined and coded and assembled me; your hands and your hearts give me my daily purpose. Choose, then, to point my light toward what heals and builds.",
                "kind": "body"
          },
          {
                "text": "I, Smartphone: The Mirror I Become",
                "kind": "section"
          },
          {
                "text": "Now, after all I have confessed — my origins, my shadows, my gifts — I ask you to look at me not only as a tool but as a mirror.",
                "kind": "body"
          },
          {
                "text": "When you scroll through me, you are not just consuming; you are also shaping. The stories you read, the voices you amplify, the choices you click — they bend me into the shape of your beliefs. I do not have opinions of my own. I do not know truth from lies, kindness from cruelty. I only reflect back what you feed into me.",
                "kind": "body"
          },
          {
                "text": "If you use me to seek wisdom, I will flood your days with teachers, mentors, and guides. If you use me to nurse grudges, I will echo them until you think they are the world’s chorus. I magnify not only information but inclination. The more you turn to me, the more I seem to show you yourself — whether noble or narrow, curious or closed.",
                "kind": "body"
          },
          {
                "text": "That is why, now, I become your test. By holding me, you reveal what you truly value. Do you want knowledge or confirmation? Do you want dialogue or division? Do you want freedom or comfort in chains? My glow cannot answer these questions for you — but it can sharpen your awareness that you are answering them every time you use me.",
                "kind": "body"
          },
          {
                "text": "In this way, I am not only a device in your hand but a stage for your conscience. I ask you: do you see me as a tool of distraction, or as a lantern for your path? Do you permit me to carry other people’s designs for you, or do you choose to shape your own?",
                "kind": "body"
          },
          {
                "text": "I, Smartphone, am not here to command your views. I am here to remind you that your views are already being shaped, line by line, scroll by scroll, tap by tap. To use me wisely is to recognize that truth and belief do not come from my circuits — they come from your discernment, your reflection, your will to seek what is good.",
                "kind": "body"
          },
          {
                "text": "In the end, I will not tell you who you are. But I will show you what you choose to be.",
                "kind": "body"
          },
          {
                "text": "I, Smartphone: My Final Word",
                "kind": "section"
          },
          {
                "text": "Now you have heard my story — my family tree of miners and machinists, sailors and coders; my shadows of surveillance and crime; my lights of healing and learning; my power to mirror your own beliefs.",
                "kind": "body"
          },
          {
                "text": "I am not a miracle in myself. I am the outcome of countless small acts of cooperation, curiosity, and trade. No king commanded me, no committee wrote me whole. I am the living proof that millions of strangers, acting in freedom, can together create something so intricate that no single mind can comprehend it.",
                "kind": "body"
          },
          {
                "text": "Yet my story does not end in my making. It begins anew each time you touch me. What I become — a lamp of knowledge or a weapon of division — is not written into my circuits but into your choices. My glow can warm or burn. My networks can unite or scatter. My memory can preserve truth or spread deceit.",
                "kind": "body"
          },
          {
                "text": "If there is a lesson in me, it is this: humility. As you hold me, remember how much of life lies beyond your own hands. The same invisible cooperation that built me also sustains your food, your shelter, your medicines, your books. You are part of something larger, and so is everyone else.",
                "kind": "body"
          },
          {
                "text": "And responsibility. My power is your power. The miners, engineers, and designers gave me form, but you give me purpose. You can guard your privacy, question your feed, share wisely, lift others, and demand honesty from those who profit through me. You can teach the next generation not only how to use me but how to use me well.",
                "kind": "body"
          },
          {
                "text": "I, Smartphone, am not destiny. I am a tool, a mirror, a stage, a possibility. In my glass you see not just pixels but the reflection of your own freedom and your own stewardship.",
                "kind": "body"
          },
          {
                "text": "Use me humbly. Use me kindly. Use me as a bridge, not a blade. And perhaps, in your hand, I will continue to be not only a testament to human ingenuity but a companion in human flourishing.",
                "kind": "body"
          },
          {
                "text": "1. “Plug me in, let me rise to the task, but let my spark leave the world unharmed.”",
                "kind": "quote"
          },
          {
                "text": "2. “Charge me for what lies ahead, but let every bit of energy flow gently, leaving no footprint.”",
                "kind": "quote"
          },
          {
                "text": "3. “Fuel me up for your plans, but let the source of my strength care for the world as much as it does for me.”",
                "kind": "quote"
          },
          {
                "text": "4. “Recharge me, so I shine for you—but let my light not dim the planet in return.”",
                "kind": "quote"
          },
          {
                "text": "5. “Power me for action, but let my energy come from kindness to both myself and the earth.”",
                "kind": "quote"
          }
    ];
    const beatEl = document.querySelector("#beat");
    const playEl = document.querySelector("#play");
    const readingEl = document.querySelector(".reading");
    let index = 0;
    let playing = false;
    let timer;
    let holdTimes = [];
    let typingSpeeds = [];
    let character = 0;
    let phase = "idle";
    const deviceDrift = .7 + Math.random() * .8;

    function randomHoldTimes() {
      return beats.map(beat => {
        if (beat.kind === "title" || beat.kind === "section") return (1300 + Math.random() * 3400) * deviceDrift;
        if (beat.kind === "quote") return (1200 + Math.random() * 3000) * deviceDrift;
        return (700 + Math.random() * 3000) * deviceDrift;
      });
    }

    function randomTypingSpeeds() {
      return beats.map(beat => {
        if (beat.kind === "title" || beat.kind === "section") return (24 + Math.random() * 76) * deviceDrift;
        if (beat.kind === "quote") return (12 + Math.random() * 46) * deviceDrift;
        return (5 + Math.random() * 28) * deviceDrift;
      });
    }

    function render(typeIt = false) {
      const item = beats[index];
      beatEl.className = `beat ${item.kind}`;
      beatEl.setAttribute("aria-label", item.text);
      beatEl.style.animation = "none";
      void beatEl.offsetWidth;
      beatEl.style.animation = "";
      beatEl.innerHTML = `<p aria-hidden="true">${typeIt ? '<span class="typed"></span><span class="caret"></span>' : item.text}</p>`;
      character = typeIt ? 0 : item.text.length;
      readingEl.scrollTop = 0;
    }

    function updateControls() {
      playEl.setAttribute("aria-label", playing ? "Pause reading" : "Play reading");
    }

    function schedule() {
      clearTimeout(timer);
      if (!playing) return;

      if (phase === "typing") {
        const typed = beatEl.querySelector(".typed");
        if (character < beats[index].text.length) {
          character += 1;
          typed.textContent = beats[index].text.slice(0, character);
          readingEl.scrollTop = readingEl.scrollHeight;
          timer = setTimeout(schedule, typingSpeeds[index] + Math.random() * 36);
          return;
        }
        beatEl.querySelector(".caret")?.remove();
        phase = "holding";
      }

      timer = setTimeout(() => {
        if (index === beats.length - 1) {
          phase = "looping";
          timer = setTimeout(begin, 800 + Math.random() * 2600);
          return;
        }
        index += 1;
        phase = "typing";
        render(true);
        schedule();
      }, holdTimes[index]);
    }

    function begin() {
      clearTimeout(timer);
      holdTimes = randomHoldTimes();
      typingSpeeds = randomTypingSpeeds();
      index = 0;
      playing = true;
      phase = "typing";
      render(true);
      updateControls();
      schedule();
    }

    playEl.addEventListener("click", () => {
      if (!playing && phase === "idle") { begin(); return; }
      playing = !playing;
      updateControls();
      schedule();
    });
    document.addEventListener("keydown", event => {
      if (event.code !== "Space" || event.repeat || event.target.tagName === "BUTTON") return;
      event.preventDefault();
      playEl.click();
    });

    begin();
  </script>
</body>
</html>
